[project]
name = "g-utils-mcp"
version = "0.1.0"
description = "Policy-controlled Gmail, Drive and Docs MCP service for Cloud Run"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=1.26,<2",
  "uvicorn>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "google-api-python-client>=2.180,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-cloud-storage>=3.3,<4",
  "google-cloud-secret-manager>=2.24,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.25,<5",
  "httpx>=0.28,<1",
  "typer>=0.16,<1",
]

[project.scripts]
g-utils-mcp = "g_utils_mcp.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2", "types-PyYAML", "types-jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g_utils_mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: explicitly configured deployed Google account tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

