# Policy v2. Anything not listed under allow is denied; deny wins over allow.
# Tool names are Google method ids with "." replaced by "_", plus helper tools.
version: 2
revision: example-001
principals:
  claude-cloud:
    # sha256 of the bearer token; `scripts/admin.py token new` adds one. Up to 3 for rotation.
    token_sha256: []
accounts:
  mailbox:
    email: mailbox@example.net
    secret: projects/your-project-id/secrets/gmail-main-refresh/versions/latest
  drive-agent:
    email: dedicated@example.net
    secret: projects/your-project-id/secrets/drive-main-refresh/versions/latest
grants:
  claude-cloud:
    mailbox:
      allow:
      - gmail_attachment_download
      - gmail_draft_compose
      - gmail_users_drafts_create
      - gmail_users_drafts_get
      - gmail_users_drafts_list
      - gmail_users_drafts_update
      - gmail_users_getProfile
      - gmail_users_labels_create
      - gmail_users_labels_delete
      - gmail_users_labels_get
      - gmail_users_labels_list
      - gmail_users_labels_patch
      - gmail_users_labels_update
      - gmail_users_messages_attachments_get
      - gmail_users_messages_get
      - gmail_users_messages_list
      - gmail_users_messages_modify
      - gmail_users_threads_get
      - gmail_users_threads_list
      - gmail_users_threads_modify
      deny:
      - gmail_users_messages_send
      - gmail_users_drafts_send
      - gmail_users_messages_delete
      - gmail_users_messages_trash
    drive-agent:
      allow:
      - docs_documents_batchUpdate
      - docs_documents_create
      - docs_documents_get
      - drive_download
      - drive_files_create
      - drive_files_export
      - drive_files_get
      - drive_files_list
      - drive_files_update
      - drive_upload
      deny:
      - drive_files_delete
      - drive_permissions_create
      - drive_permissions_update
      - drive_permissions_delete
