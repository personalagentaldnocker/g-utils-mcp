name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -m 'not live'
      - run: uv run python scripts/generate_api_catalog.py --check
      - run: docker build -t g-utils:test .
      - run: bash scripts/verify_image.sh g-utils:test
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - run: terraform fmt -check -recursive infrastructure
      - run: |
          for root in bootstrap foundation service; do
            terraform -chdir=infrastructure/$root init -backend=false -input=false
            terraform -chdir=infrastructure/$root validate
          done
          terraform -chdir=infrastructure/foundation test
          terraform -chdir=infrastructure/service test
